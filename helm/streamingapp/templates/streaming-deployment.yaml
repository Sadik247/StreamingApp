apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.streaming.name }}
  labels:
    {{- include "streamingapp.labels" . | nindent 4 }}
    app: {{ .Values.services.streaming.name }}
spec:
  replicas: {{ .Values.services.streaming.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Values.services.streaming.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.services.streaming.name }}

    spec:
      containers:
        - name: streaming
          image: "{{ .Values.services.streaming.image }}:{{ .Values.services.streaming.tag }}"
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: {{ .Values.services.streaming.port }}
              protocol: TCP

          env:
            - name: PORT
              value: "{{ .Values.services.streaming.port }}"

            - name: MONGO_URI
            valueFrom:
                secretKeyRef:
                name: {{ include "streamingapp.fullname" . }}-secret
                key: MONGO_URI

            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-config
                  key: CLIENT_URLS

            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-config
                  key: AWS_REGION

            - name: AWS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-config
                  key: AWS_S3_BUCKET

            - name: AWS_CDN_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-config
                  key: AWS_CDN_URL

            - name: STREAMING_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-config
                  key: STREAMING_PUBLIC_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-secret
                  key: JWT_SECRET

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-secret
                  key: AWS_SECRET_ACCESS_KEY

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}