apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.frontend.name }}
  labels:
    {{- include "streamingapp.labels" . | nindent 4 }}
    app: {{ .Values.services.frontend.name }}

spec:
  replicas: {{ .Values.services.frontend.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Values.services.frontend.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.services.frontend.name }}

    spec:
      containers:
        - name: frontend
          image: "{{ .Values.services.frontend.image }}:{{ .Values.services.frontend.tag }}"
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: {{ .Values.services.frontend.port }}
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}