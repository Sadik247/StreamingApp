apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.auth.name }}
  labels:
    {{- include "streamingapp.labels" . | nindent 4 }}
    app: {{ .Values.services.auth.name }}
spec:
  type: ClusterIP

  selector:
    app: {{ .Values.services.auth.name }}

  ports:
    - name: http
      port: {{ .Values.services.auth.port }}
      targetPort: http
      protocol: TCP