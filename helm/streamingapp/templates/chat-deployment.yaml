apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.chat.name }}
  labels:
    {{- include "streamingapp.labels" . | nindent 4 }}
    app: {{ .Values.services.chat.name }}

spec:
  replicas: {{ .Values.services.chat.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Values.services.chat.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.services.chat.name }}

    spec:
      containers:
        - name: chat
          image: "{{ .Values.services.chat.image }}:{{ .Values.services.chat.tag }}"
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: {{ .Values.services.chat.port }}
              protocol: TCP

          env:
            - name: PORT
              value: "{{ .Values.services.chat.port }}"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default (printf "%s-secret" (include "streamingapp.fullname" .)) }}
                  key: MONGO_URI

            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-config
                  key: CLIENT_URLS

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default (printf "%s-secret" (include "streamingapp.fullname" .)) }}
                  key: JWT_SECRET

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}