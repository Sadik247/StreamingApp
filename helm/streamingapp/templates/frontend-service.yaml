apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.frontend.name }}
  labels:
    {{- include "streamingapp.labels" . | nindent 4 }}
    app: {{ .Values.services.frontend.name }}

spec:
  type: ClusterIP

  selector:
    app: {{ .Values.services.frontend.name }}

  ports:
    - name: http
      port: {{ .Values.services.frontend.port }}
      targetPort: http
      protocol: TCP